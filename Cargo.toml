[package]
name = "flux-capacitor"
version = "0.1.0"
edition = "2024"
description = "Watch coding agents change your projects in real time"
homepage = "https://github.com/juanandresgs/FluxCapacitor"
license = "MIT"
repository = "https://github.com/juanandresgs/FluxCapacitor"
readme = "README.md"
rust-version = "1.88"
keywords = ["filesystem", "tui", "watcher", "git", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "flux"
path = "src/main.rs"

[package.metadata.dist]
formula = "flux"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
notify = "8.2.0"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
similar = "3.1.1"
walkdir = "2.5.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
